services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lesson1
      POSTGRES_USER: lesson1
      POSTGRES_PASSWORD: lesson1
    ports:
      - "5432:5432"
    volumes:
      - lesson1_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lesson1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lesson1_postgres:
